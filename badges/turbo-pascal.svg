<svg xmlns="http://www.w3.org/2000/svg"
     width="100"
     height="20"
     viewBox="0 0 100 20"
     preserveAspectRatio="xMidYMid meet">
  <rect width="100" height="20" fill="#0000AA"/>
  <text x="50"
      y="14"
      fill="#FFFF55"
      text-anchor="middle"
      font-family="Courier New, Courier, Liberation Mono, monospace"
      font-size="13px"
      font-weight="bold"
      textLength="92"
      lengthAdjust="spacingAndGlyphs">
    Turbo Pascal
